name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ARCHIVE_TEST_DATABASE_URL: postgresql://stockflow_test:fixture-only@127.0.0.1:5432/stockflow_archive_test
    services:
      archive-postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: stockflow_archive_test
          POSTGRES_USER: stockflow_test
          POSTGRES_PASSWORD: fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stockflow_test -d stockflow_archive_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      # A clean checkout needs Next-generated route types before tsc can resolve them.
      - name: Build all packages
        run: npm run build
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Run API integration tests
        run: npm test
      - name: Verify private PostgreSQL archive and Swagger
        run: npm run test:archive
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Docker deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies for smoke client
        run: npm ci
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start production containers
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify web, REST and WebSocket
        run: node scripts/smoke-deployment.mjs
      - name: Container failure logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop containers
        if: always()
        run: docker compose down
